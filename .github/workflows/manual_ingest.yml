name: Manual PDF Ingest

on:
  workflow_dispatch:
    inputs:
      pdf_date:
        description: "Week date in YYYY-MM-DD format (e.g. 2026-04-21)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfplumber requests

      - name: Find PDF in data/pdfs
        run: |
          echo "📂 Contents of data/pdfs/:"
          ls -la data/pdfs/
          PDF=$(find data/pdfs -name "*.pdf" | head -1)
          if [ -z "$PDF" ]; then
            echo "❌ No .pdf file found in data/pdfs/"
            exit 1
          fi
          echo "✅ Using PDF: $PDF"
          # Write to file to avoid spaces-in-path issues
          echo "$PDF" > /tmp/pdf_path.txt

      - name: Run ingest
        run: |
          PDF=$(cat /tmp/pdf_path.txt)
          python ingest_manual_pdf.py "$PDF" \
            --date "${{ github.event.inputs.pdf_date }}"

      - name: Commit and push updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "✅ No changes"
          else
            git commit -m "🛢️ Manual ingest — ${{ github.event.inputs.pdf_date }}"
            git push
          fi
