name: Weekly Fuel Price Update

on:
  schedule:
    # Tuesday 6AM UTC = 2PM Manila (DOE usually publishes Tuesday morning)
    - cron: "0 6 * * 2"
    # Tuesday 11PM UTC = 7AM Wednesday Manila (retry if morning failed)
    - cron: "0 23 * * 2"
    # Wednesday 6AM UTC = 2PM Manila (last resort retry)
    - cron: "0 6 * * 3"
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-pdfplumber-requests

      - name: Install dependencies
        run: |
          pip install pdfplumber requests

      - name: Ensure pdfs directory exists
        run: |
          mkdir -p data/pdfs
          touch data/pdfs/.gitkeep

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/prices.json data/pdfs/

          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "✅ No changes — data is already up to date"
          else
            WEEK=$(date -u +"%Y-W%U")
            git commit -m "🛢️ Auto update fuel prices — ${WEEK}"
            git push
          fi
