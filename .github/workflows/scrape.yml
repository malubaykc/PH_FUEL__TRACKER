name: Weekly Fuel Update

on:
  schedule:
    - cron: "0 6 * * 2"   # Tuesday 6AM UTC = 2PM Manila (first attempt)
    - cron: "0 0 * * 3"   # Wednesday midnight UTC = 8AM Manila (retry if Tuesday failed)
    - cron: "0 6 * * 3"   # Wednesday 6AM UTC = 2PM Manila (last resort retry)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pdfplumber requests

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/prices.json data/pdfs/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update fuel prices + PDF backup"

          git push
